<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Nuts Price Insights</title>

  <meta
    name="description"
    content="Global nuts market price intelligence."
  />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <div class="header-content">

      <div class="header-text">

        <h1>Nuts Price Insights</h1>

        <p class="subtitle">
          From data to decisions
        </p>

      </div>

      <!-- PRODUCT SWITCHER -->

      <div class="product-switcher">

        <button
          class="product-switch active"
          data-product="cashew"
        >
          Cashew
        </button>

        <button
          class="product-switch"
          data-product="pistachio"
        >
          Pistachio
        </button>

      </div>

    </div>

  </header>

  <!-- =========================
       MAIN
  ========================== -->

  <main class="main-content">

    <section class="chart-section">

      <div class="card">

        <!-- PRICE AREA -->

        <div class="price-container">

          <div class="price-left">

            <h2
              id="productTitle"
              class="product-title"
            >
              Loading...
            </h2>

            <div
              id="productPrice"
              class="price"
            >
              --
            </div>

            <div
              id="productChange"
              class="change"
            >
            </div>

          </div>

          <!-- TICKERS -->

          <div class="top-bar">

            <div
              class="chart-actions"
              id="tickerContainer"
            >
            </div>

          </div>

        </div>

        <!-- CHART -->

        <div class="chart-wrapper">

          <canvas id="currencyChart"></canvas>

        </div>

      </div>

    </section>

  </main>

  <!-- =========================
       JS
  ========================== -->

  <script src="app.js"></script>

</body>

</html>
